name: CI - Compilar forjaX y publicar Release

# Disparadores:
#  - push a master/main (cambios de código) → publica/actualiza la Release "latest"
#  - push de un tag vX.Y                   → publica una Release versionada
#  - workflow_dispatch                     → publica/actualiza la Release "latest"
on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Serializa los runs de la misma rama/tag para que dos pushes seguidos
# no suban assets a la misma Release al mismo tiempo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── 1) Repositorio actual (main.fa, proceso_externo.fa, etc.) ──
      - name: Checkout cs2-rayosx-forja
        uses: actions/checkout@v4

      # ── 2) Descargar el último release de Forja (forja.exe + forja-rt.exe) ──
      #    Se usan las URLs de latest/download para no consumir la API de
      #    GitHub (la API sin autenticar devuelve 403 por rate limit en los
      #    runners compartidos).
      #    forja-rt.exe es el stub que `forja compilar` usa para generar el
      #    .exe autónomo (debe estar junto a forja.exe).
      - name: Descargar ultimo release de Forja
        shell: pwsh
        run: |
          $base = 'https://github.com/forja-lang/forja/releases/latest/download'
          foreach ($nombre in @('forja.exe', 'forja-rt.exe')) {
            Invoke-WebRequest -Uri "$base/$nombre" -OutFile $nombre
            if (-not (Test-Path $nombre)) {
              Write-Error "No se pudo descargar '$nombre' desde $base"
              exit 1
            }
          }
          Get-Item forja.exe, forja-rt.exe | Select-Object Name, Length

      # ── 3) Compilar el inyector a .exe autónomo ──
      #    `forja compilar` genera un exe con la VM + bytecode embebido,
      #    usando forja-rt.exe (mismo directorio) como stub.
      - name: Compilar cs2-rayosX-forja.exe
        shell: pwsh
        run: |
          & .\forja.exe compilar main.fa -o cs2-rayosX-forja.exe
          Get-Item cs2-rayosX-forja.exe | Select-Object Name, Length

      # ── 4) Empaquetar el .zip ──
      - name: Crear ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path cs2-rayosX-forja.exe -DestinationPath cs2-rayosX-forja.zip -Force
          Get-Item cs2-rayosX-forja.zip | Select-Object Name, Length

      # ── 5) Subir artifacts (siempre) ──
      - name: Subir artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cs2-rayosX-forja
          path: |
            cs2-rayosX-forja.exe
            cs2-rayosX-forja.zip

      # ── 6) Publicar Release en cada cambio de código ──
      #    - tag vX.Y    → Release versionada con ese tag.
      #    - master/main → Release rodante "latest" (se actualiza en cada push).
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_URL="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="cs2-rayosX-forja ${TAG}"
            NOTES="Release ${TAG}. Commit: ${COMMIT_URL}"
          else
            TAG="latest"
            TITLE="cs2-rayosX-forja build ${SHORT_SHA}"
            NOTES="Build automático de ${SHORT_SHA} (${GITHUB_REF_NAME}). Commit: ${COMMIT_URL}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" cs2-rayosX-forja.exe cs2-rayosX-forja.zip --clobber
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --draft=false \
              --prerelease=false \
              --latest
          else
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              gh release create "$TAG" cs2-rayosX-forja.exe cs2-rayosX-forja.zip \
                --title "$TITLE" \
                --notes "$NOTES" \
                --draft=false \
                --latest
            else
              gh release create "$TAG" cs2-rayosX-forja.exe cs2-rayosX-forja.zip \
                --title "$TITLE" \
                --notes "$NOTES" \
                --draft=false \
                --prerelease=false \
                --latest
            fi
          fi
